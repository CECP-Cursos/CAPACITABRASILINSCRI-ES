<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel da Equipe — Inscrições, Presenças e Certificados | CECP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#04213a;--navy-800:#063a63;--brand:#084A7D;--brand-light:#2f6a9e;
  --tint:#eaf2f8;--paper:#fbfbf9;--ink:#0d1b2a;--muted:#5c7186;--line:#d7e3ec;
  --gold:#c08a35;--gold-light:#e7c079;--ok:#2f7d4f;--ok-bg:#e5f3ea;
  --danger:#b23b3b;--danger-bg:#fbe9e9;--warn:#8a5f1e;--warn-bg:#f8efdc;
  --radius:14px;--shadow:0 12px 32px -16px rgba(4,33,58,.35);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-.01em;}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.hidden{display:none !important;}
.container{max-width:1180px;margin:0 auto;padding:0 28px;}
:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px;}

/* header */
header.site-header{position:sticky;top:0;z-index:50;background:rgba(251,251,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:52px;width:auto;}
.brand-name{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;color:var(--brand);line-height:1.1;}
.brand-name span{display:block;font-family:'Inter',sans-serif;font-size:.68rem;font-weight:500;color:var(--muted);letter-spacing:.03em;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:100px;border:none;font-weight:600;font-size:.9rem;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -8px rgba(8,74,125,.6);}
.btn-primary:hover{background:var(--navy-800);}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 8px 20px -8px rgba(192,138,53,.55);}
.btn-gold:hover{background:#a9762a;}
.btn-ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
.btn-ghost:hover{background:var(--tint);}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 15% -10%,var(--navy-800) 0%,var(--brand) 46%,var(--navy-900) 100%);color:#fff;padding:0 0 118px;}
.hero-photo-strip{position:relative;width:100%;height:190px;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14);}
.hero-photo-strip::before,.hero-photo-strip::after{content:'';position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none;}
.hero-photo-strip::before{left:0;background:linear-gradient(90deg,var(--navy-900),transparent);}
.hero-photo-strip::after{right:0;background:linear-gradient(-90deg,var(--navy-900),transparent);}
.hero-photo-strip-track{position:absolute;top:0;left:0;height:100%;display:flex;animation:heroPhotoScroll 40s linear infinite;}
.hero-photo-strip-track img{height:100%;width:auto;flex:none;object-fit:cover;opacity:.78;}
@keyframes heroPhotoScroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
@media (prefers-reduced-motion:reduce){.hero-photo-strip-track{animation:none;}}
@media (max-width:640px){.hero-photo-strip{height:120px;}}

/* forms */
.field{margin-bottom:15px;}
.field label,.field .lbl{display:block;font-size:.8rem;font-weight:600;color:var(--navy-800);margin-bottom:6px;}
.field input,.field select{width:100%;padding:12px 13px;border-radius:9px;border:1.4px solid var(--line);font-size:.95rem;font-family:inherit;background:#fff;color:var(--ink);}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(8,74,125,.14);}
.field.invalid input,.field.invalid select{border-color:var(--danger);}
.field .err{display:none;font-size:.76rem;color:var(--danger);margin-top:5px;}
.field.invalid .err{display:block;}
.hint{font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.5;}
.form-msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.86rem;display:none;line-height:1.5;}
.form-msg.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.form-msg.err{display:block;background:var(--danger-bg);color:var(--danger);}

.pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:100px;font-size:.74rem;font-weight:700;white-space:nowrap;}
.pill.ok{background:var(--ok-bg);color:var(--ok);}
.pill.no{background:var(--danger-bg);color:var(--danger);}
.pill.warn{background:var(--warn-bg);color:var(--warn);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,17,30,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s ease;}
.modal-overlay.active{opacity:1;pointer-events:auto;}
.modal-box{background:#fff;border-radius:18px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto;position:relative;transform:translateY(14px);transition:transform .18s ease;}
.modal-overlay.active .modal-box{transform:translateY(0);}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:100px;border:none;background:var(--tint);color:var(--navy-800);font-size:1.05rem;z-index:3;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--line);}
.modal-content{padding:28px 30px 30px;}
.modal-content h2{font-size:1.45rem;color:var(--navy-900);padding-right:36px;}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:.86rem;z-index:300;opacity:0;pointer-events:none;transition:all .2s ease;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--danger);}

footer{background:var(--navy-900);color:#cfe0ee;padding:40px 0 26px;}
footer .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
footer .foot-brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;color:#fff;}
footer small{color:#7f9cb2;font-size:.78rem;}

@media (max-width:560px){
  .container{padding:0 18px;}
  .header-inner{padding:10px 18px;}
  .brand img{height:44px;}
  .brand-name span{display:none;}
  .modal-content{padding:24px 20px 24px;}
}

body{background:var(--tint);min-height:100vh;display:flex;flex-direction:column;}
main{flex:1;}
.who{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--navy-800);}
.who b{font-family:'Fraunces',serif;}

/* login */
.auth-wrap{padding:64px 0 90px;}
.auth-card{max-width:440px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 30px 30px;}
.auth-card h2{font-size:1.5rem;color:var(--navy-900);}
.auth-card .sub{color:var(--muted);font-size:.9rem;margin:6px 0 22px;line-height:1.5;}
.pw{position:relative;}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--brand);font-weight:600;font-size:.78rem;padding:8px 10px;border-radius:8px;}
.pw button:hover{background:var(--tint);}
.pw input{padding-right:70px;}

/* painel */
.dash{padding:32px 0 70px;}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px;}
.panel h3{font-size:1.15rem;color:var(--navy-900);margin-bottom:14px;}
.select-wrap{position:relative;max-width:460px;}
.select-wrap select{appearance:none;-webkit-appearance:none;padding-right:44px;font-weight:600;color:var(--navy-900);}
.select-wrap::after{content:'';position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--brand);border-bottom:2.5px solid var(--brand);transform:translateY(-70%) rotate(45deg);pointer-events:none;}
.course-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
.course-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--navy-900);min-width:190px;transition:border-color .15s,background .15s;}
.course-btn:hover{border-color:var(--brand-light);}
.course-btn.on{border-color:var(--brand);background:var(--tint);}
.course-btn b{font-size:.92rem;}
.course-btn span{font-size:.78rem;color:var(--muted);}
.lbl-mini{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:20px 0 8px;}

.list-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.list-head h3{margin:0;}
.list-head .sub{font-size:.85rem;color:var(--muted);margin-top:4px;}
.counters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.counter{border-radius:10px;padding:8px 14px;background:var(--tint);min-width:96px;}
.counter b{display:block;font-family:'Fraunces',serif;font-size:1.3rem;color:var(--navy-900);}
.counter span{font-size:.72rem;color:var(--muted);font-weight:600;}
.counter.ok{background:var(--ok-bg);} .counter.ok b{color:var(--ok);}
.counter.no{background:var(--danger-bg);} .counter.no b{color:var(--danger);}
.counter.rep{background:var(--warn-bg);} .counter.rep b{color:var(--warn);}
.toolbar{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.toolbar input{flex:1;min-width:200px;padding:11px 13px;border-radius:9px;border:1.4px solid var(--line);font-size:.92rem;font-family:inherit;}
.toolbar input:focus{outline:none;border-color:var(--brand);}
.btn-sm{padding:9px 16px;font-size:.84rem;}

.aluno{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line);}
.aluno:last-child{border-bottom:none;}
.a-n{width:28px;color:var(--muted);font-size:.8rem;flex:none;}
.a-info{flex:1;min-width:0;}
.a-info b{display:block;font-size:.95rem;color:var(--navy-900);}
.a-info span{font-size:.8rem;color:var(--muted);}
.a-info a{color:var(--brand);font-weight:600;}
.a-info a:hover{text-decoration:underline;}
.a-btns{display:flex;gap:8px;flex:none;}
.pb{padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:.8rem;font-weight:700;color:var(--muted);line-height:1.2;transition:all .15s;}
.pb:disabled{opacity:.55;cursor:wait;}
.pb.ok:hover,.pb.ok.on{border-color:var(--ok);background:var(--ok);color:#fff;}
.pb.no:hover,.pb.no.on{border-color:var(--danger);background:var(--danger);color:#fff;}
.pb.rep:hover,.pb.rep.on{border-color:var(--gold);background:var(--gold);color:#fff;}
.pb.rep{max-width:130px;}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:.92rem;}

@media (max-width:760px){
  .aluno{flex-wrap:wrap;}
  .a-btns{width:100%;padding-left:28px;}
  .pb{flex:1;padding:10px 6px;}
  .pb.rep{max-width:none;}
  .course-btn{min-width:100%;}
  .panel{padding:20px 16px;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <img src="assets/images/logo.png" alt="CECP">
      <div class="brand-name">Painel da Equipe<span>Capacita Brasil · Inscrições, Presenças e Certificados</span></div>
    </div>
    <div class="who hidden" id="who"><span>Olá, <b id="who-nome"></b></span><button class="btn btn-ghost btn-sm" id="btn-sair">Sair</button></div>
  </div>
</header>

<main>
  <!-- LOGIN -->
  <section class="auth-wrap" id="view-login">
    <div class="container">
      <div class="auth-card">
        <h2>Acesso da equipe</h2>
        <p class="sub">Entre com seu CPF e a senha cadastrada na aba Administradores da planilha.</p>
        <form id="form-login" novalidate>
          <div class="field"><label for="l-cpf">CPF</label>
            <input type="text" id="l-cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="username"></div>
          <div class="field"><label for="l-senha">Senha</label>
            <div class="pw"><input type="password" id="l-senha" autocomplete="current-password"><button type="button" id="ver-senha">Mostrar</button></div></div>
          <button type="submit" class="btn btn-primary btn-block" id="btn-entrar">Entrar</button>
          <div class="form-msg" id="login-msg" role="alert"></div>
        </form>
      </div>
    </div>
  </section>

  <!-- PAINEL -->
  <section class="dash hidden" id="view-painel">
    <div class="container">
      <div class="panel">
        <h3>Escolha a turma</h3>
        <div class="field" style="margin-bottom:0;">
          <label for="sel-cidade">Cidade</label>
          <div class="select-wrap"><select id="sel-cidade"><option value="">Carregando cidades…</option></select></div>
        </div>
        <div id="cursos-area" class="hidden">
          <div class="lbl-mini">Cursos da cidade</div>
          <div class="course-list" id="cursos-lista"></div>
        </div>
      </div>

      <div class="panel hidden" id="painel-alunos">
        <div class="list-head">
          <div><h3 id="al-titulo"></h3><div class="sub" id="al-sub"></div></div>
          <button class="btn btn-ghost btn-sm" id="btn-atualizar">Atualizar lista</button>
        </div>
        <div class="counters" id="contadores"></div>
        <div class="toolbar"><input type="search" id="busca" placeholder="Buscar aluno por nome ou CPF…"></div>
        <div id="alunos-lista"></div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<footer>
  <div class="container">
    <div class="foot-brand"><img src="assets/images/logo.png" style="height:32px;filter:brightness(0) invert(1);" alt=""> CECP — Painel da Equipe</div>
    <small>© 2020–2026 Centro de Educação e Capacitação Profissional</small>
  </div>
</footer>

<script>
const CONFIG = {
  API_URL: 'COLE_AQUI_A_URL_DO_WEB_APP'   // a mesma URL "/exec" usada no site de inscrições
};

const P = {PENDENTE:'Pendente', PRESENTE:'Presente', FALTOU:'Faltou', REPOSICAO:'Faltou/Reposição online'};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soDigitos = s => String(s || '').replace(/\D/g, '');
const semAcento = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

let token = sessionStorage.getItem('cecp_token') || '';
let CIDADES = [], cidade = null, curso = null, ALUNOS = [];

async function api(action, payload){
  if(!CONFIG.API_URL || CONFIG.API_URL.indexOf('COLE_AQUI') === 0) return {ok:false, erro:'O painel ainda não foi conectado à planilha (falta configurar a URL da API).'};
  try{
    const r = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({action, token}, payload || {}))});
    const j = await r.json();
    if(j.sessaoExpirada){ sair('Sua sessão expirou. Entre novamente.'); }
    return j;
  }catch(e){ return {ok:false, erro:'Sem conexão com o servidor. Tente novamente.'}; }
}

let toastT;
function toast(msg, erro){
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (erro ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3200);
}

/* ---------- login ---------- */
$('l-cpf').addEventListener('input', e => e.target.value = soDigitos(e.target.value).slice(0,11)
  .replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'));
$('ver-senha').onclick = () => {
  const i = $('l-senha'), mostrar = i.type === 'password';
  i.type = mostrar ? 'text' : 'password'; $('ver-senha').textContent = mostrar ? 'Ocultar' : 'Mostrar';
};

$('form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('btn-entrar'), msg = $('login-msg');
  const cpf = soDigitos($('l-cpf').value), senha = $('l-senha').value;
  msg.className = 'form-msg';
  if(cpf.length !== 11 || !senha){ msg.className = 'form-msg err'; msg.textContent = 'Informe o CPF (11 dígitos) e a senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando…';
  const res = await api('adminLogin', {cpf, senha});
  btn.disabled = false; btn.textContent = 'Entrar';
  if(!res.ok){ msg.className = 'form-msg err'; msg.textContent = res.erro || 'Não foi possível entrar.'; return; }
  token = res.token; sessionStorage.setItem('cecp_token', token); sessionStorage.setItem('cecp_nome', res.nome);
  $('l-senha').value = '';
  abrirPainel(res.nome);
});

function sair(aviso){
  if(token) api('adminLogout');
  token = ''; sessionStorage.removeItem('cecp_token'); sessionStorage.removeItem('cecp_nome');
  cidade = curso = null; ALUNOS = [];
  $('who').classList.add('hidden'); $('view-painel').classList.add('hidden'); $('view-login').classList.remove('hidden');
  if(aviso){ const m = $('login-msg'); m.className = 'form-msg err'; m.textContent = aviso; }
}
$('btn-sair').onclick = () => sair();

/* ---------- painel ---------- */
async function abrirPainel(nome){
  $('who-nome').textContent = nome || sessionStorage.getItem('cecp_nome') || '';
  $('who').classList.remove('hidden');
  $('view-login').classList.add('hidden'); $('view-painel').classList.remove('hidden');
  $('painel-alunos').classList.add('hidden'); $('cursos-area').classList.add('hidden');
  const res = await api('adminCidades');
  if(!res.ok){ if(!res.sessaoExpirada) toast(res.erro || 'Erro ao carregar cidades.', true); return; }
  CIDADES = res.cidades;
  const sel = $('sel-cidade');
  sel.innerHTML = '<option value="">Selecione a cidade…</option>' +
    CIDADES.map(c => `<option value="${esc(c.id)}">${esc(c.rotulo)}${c.status === 'Ativo' ? '' : ' (inativa)'}</option>`).join('');
}

$('sel-cidade').onchange = e => {
  cidade = CIDADES.find(c => c.id === e.target.value) || null; curso = null;
  $('painel-alunos').classList.add('hidden');
  if(!cidade){ $('cursos-area').classList.add('hidden'); return; }
  $('cursos-area').classList.remove('hidden');
  $('cursos-lista').innerHTML = cidade.cursos.length ? cidade.cursos.map((k,i) => `
    <button class="course-btn" data-i="${i}"><b>${esc(k.nome)}</b><span>${esc(k.horario)} · ${k.inscritos} inscrito(s)</span></button>`).join('')
    : '<div class="empty">Esta cidade não tem cursos cadastrados.</div>';
  $('cursos-lista').querySelectorAll('.course-btn').forEach(b => b.onclick = () => escolherCurso(+b.dataset.i));
};

async function escolherCurso(i){
  curso = cidade.cursos[i];
  document.querySelectorAll('.course-btn').forEach((b,j) => b.classList.toggle('on', j === i));
  $('painel-alunos').classList.remove('hidden');
  $('al-titulo').textContent = curso.nome;
  $('al-sub').textContent = cidade.rotulo + ' · ' + curso.horario;
  $('busca').value = '';
  await carregarAlunos();
}

async function carregarAlunos(){
  $('alunos-lista').innerHTML = '<div class="empty">Carregando alunos…</div>';
  const res = await api('adminAlunos', {cidade: cidade.rotulo, curso: curso.nome});
  if(!res.ok){ $('alunos-lista').innerHTML = `<div class="empty">${esc(res.erro || 'Erro ao carregar.')}</div>`; return; }
  ALUNOS = res.alunos;
  render();
}
$('btn-atualizar').onclick = () => curso && carregarAlunos();
$('busca').oninput = render;

function render(){
  const n = p => ALUNOS.filter(a => a.presenca === p).length;
  $('contadores').innerHTML = `
    <div class="counter"><b>${ALUNOS.length}</b><span>Inscritos</span></div>
    <div class="counter ok"><b>${n(P.PRESENTE)}</b><span>Presentes</span></div>
    <div class="counter rep"><b>${n(P.REPOSICAO)}</b><span>Reposição online</span></div>
    <div class="counter no"><b>${n(P.FALTOU)}</b><span>Faltaram</span></div>
    <div class="counter"><b>${ALUNOS.filter(a => !a.presenca || a.presenca === P.PENDENTE).length}</b><span>Sem marcação</span></div>`;

  const q = semAcento($('busca').value), qd = soDigitos($('busca').value);
  const lista = ALUNOS.filter(a => !q || semAcento(a.nome).includes(q) || (qd && soDigitos(a.cpf).includes(qd)));
  if(!lista.length){ $('alunos-lista').innerHTML = `<div class="empty">${ALUNOS.length ? 'Nenhum aluno encontrado na busca.' : 'Nenhum aluno inscrito neste curso ainda.'}</div>`; return; }

  $('alunos-lista').innerHTML = lista.map(a => {
    const ix = ALUNOS.indexOf(a);
    const b = (v, cls, rotulo) => `<button class="pb ${cls} ${a.presenca === v ? 'on' : ''}" data-i="${ix}" data-v="${v}" aria-pressed="${a.presenca === v}" title="${v}">${rotulo}</button>`;
    return `<div class="aluno" id="al-${ix}">
      <div class="a-n">${ix + 1}</div>
      <div class="a-info"><b>${esc(a.nome)}</b><span>${esc(a.cpf)} · <a href="https://wa.me/55${soDigitos(a.whats)}" target="_blank" rel="noopener">${esc(a.whats)}</a></span></div>
      <div class="a-btns" role="group" aria-label="Presença de ${esc(a.nome)}">
        ${b(P.PRESENTE, 'ok', 'Presente')}${b(P.FALTOU, 'no', 'Faltou')}${b(P.REPOSICAO, 'rep', 'Faltou/Reposição online')}
      </div></div>`;
  }).join('');
  $('alunos-lista').querySelectorAll('.pb').forEach(btn => btn.onclick = () => marcar(+btn.dataset.i, btn.dataset.v));
}

async function marcar(ix, valor){
  const a = ALUNOS[ix], antes = a.presenca;
  const novo = (antes === valor) ? P.PENDENTE : valor;      // clicar de novo limpa a marcação
  document.querySelectorAll('#al-' + ix + ' .pb').forEach(b => b.disabled = true);
  const res = await api('adminMarcar', {cidade: cidade.rotulo, curso: curso.nome, cpf: soDigitos(a.cpf), presenca: novo});
  if(res.ok){ a.presenca = novo; }
  else if(!res.sessaoExpirada){ toast(res.erro || 'Não foi possível salvar a marcação.', true); }
  render();
}

/* ---------- retomar sessão ---------- */
if(token) abrirPainel();
</script>
